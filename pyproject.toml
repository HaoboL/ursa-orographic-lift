[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ursa-orographic-lift"
version = "0.1.0"
description = "Physics-guided upstream-ridge sheltering adapter for engineering orographic-lift fields"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23",
  "scipy>=1.9",
]

[tool.setuptools.packages.find]
where = ["src"]

